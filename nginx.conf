server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    types {
        video/x-matroska mkv;
    }

    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }
}
